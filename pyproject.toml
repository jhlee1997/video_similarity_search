[project]
name = "vidsim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lee Jae Ho", email = "jae.ho.lee@sap.com" }
]
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.2",
    "click>=8.5.1",
    "faiss-cpu>=1.16.0",
    "numpy>=2.5.5",
    "tqdm>=4.70.1",
    "vpdq>=0.2.5",
]

[project.scripts]
vidsim = "vidsim:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
